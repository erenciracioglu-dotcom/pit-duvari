name: Veri ve yayın

on:
  push:
    branches: [main]
  schedule:
    # her 30 dakikada bir (yoğun :00 ve :30 dakikalarından kaçınarak)
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      stories_budget:
        description: Bu çalışmada en fazla kaç yarış hikâyesi üretilsin
        default: '8'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pit-duvari
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Tetiklenen commit yerine main'in o anki hali: sırada bekleyen çalışma,
          # bir önceki çalışmanın kaydettiği hikâyeleri görsün ve aynılarını yeniden üretmesin.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Önbelleği geri yükle
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: pd-cache-${{ github.run_id }}
          restore-keys: pd-cache-

      - name: Veriyi üret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs --out=_site/data --stories-budget=${{ github.event.inputs.stories_budget || '8' }}

      - name: Önbelleği kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: pd-cache-${{ github.run_id }}

      - name: Yeni yarış hikâyelerini ve sonuç özetlerini repoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Zamanlanmış iş 60 gün işlem olmayınca durur: ayda bir küçük bir kayıt düş
          if [ "$(date -u +%d%H)" = "0103" ] && [ "$(date -u +%M)" -lt 30 ]; then date -u +%FT%TZ > .github/keepalive; git add .github/keepalive; fi
          git add data/stories data/results
          if ! git diff --cached --quiet; then
            git commit -m "Veri: yarış hikâyeleri ve sonuç özetleri"
            git pull --rebase --autostash origin main && git push origin HEAD:main || echo "push atlandı"
          fi

      - name: Siteyi topla
        run: |
          for f in index.html sw.js manifest.webmanifest 404.html robots.txt; do if [ -f "$f" ]; then cp "$f" _site/; fi; done
          if [ -d assets ]; then cp -r assets _site/; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pit-duvari-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub'ın zamanlayıcısı yeni repolarda saatlerce gecikebiliyor ya da seyrek çalışıyor.
  # Bu iş "tick" ortamındaki bekleme süresi (25 dk) dolunca sıradaki çalışmayı başlatır.
  # Bekleme sırasında makine ayrılmaz, dakika harcanmaz. Bu arada daha yeni bir çalışma
  # başladıysa (zamanlayıcı, push ya da elle) zinciri o sürdürür; ortamda bekleme süresi
  # yoksa hiç zincir kurulmaz.
  tick:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: tick
    concurrency:
      group: pit-duvari-tick
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: Sıradaki güncellemeyi başlat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          now=$(date -u +%s)
          latest=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?per_page=1" --jq '.workflow_runs[0].id')
          if [ "$latest" != "$RUN_ID" ]; then
            echo "Daha yeni bir çalışma var ($latest); zinciri o sürdürecek."
            exit 0
          fi
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          waited=$(( (now - $(date -u -d "$started" +%s)) / 60 ))
          if [ "$waited" -lt 20 ]; then
            echo "::warning::'tick' ortamında bekleme süresi yok (çalışma ${waited} dk önce başladı); zincir kurulmadı."
            exit 0
          fi
          gh workflow run build.yml --repo "$REPO" --ref main
          echo "Sıradaki güncelleme başlatıldı."
